name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q core models services ui workers utils main.py tests
      - name: Core tests
        run: pytest -q
      - name: Pipeline smoke test
        run: python main.py --smoke-test

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean BatchWatermarkToolPro.spec
      - name: Verify packaged EXE
        env:
          WATERMARK_SMOKE_REPORT: exe-smoke.json
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/BatchWatermarkToolProV5.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'EXE smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw 'EXE smoke test failed' }
          $report = Get-Content exe-smoke.json | ConvertFrom-Json
          if (-not $report.success -or $report.version -ne '5.0.0-alpha.1') { throw 'EXE verification report invalid' }
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BatchWatermarkToolProV5-verification
          path: exe-smoke.json
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BatchWatermarkToolProV5-Windows
          path: dist/BatchWatermarkToolProV5.exe
          if-no-files-found: error
