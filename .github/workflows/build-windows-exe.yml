name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Syntax check
        run: python -m compileall -q app.py enhancements.py imaging.py pro.py launcher.py smoke_test.py test_imaging.py
      - name: Image processing tests
        run: python -m unittest test_imaging -v
      - name: Windows UI smoke test
        env:
          WATERMARK_SMOKE_REPORT: source-smoke.json
        run: |
          python launcher.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Source smoke test failed' }
          $r = Get-Content source-smoke.json | ConvertFrom-Json
          if (-not $r.success -or -not $r.dnd_available) { throw 'Source verification failed' }
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all tkinterdnd2 --name BatchWatermarkToolProV4_2 launcher.py
      - name: Verify packaged EXE
        env:
          WATERMARK_SMOKE_REPORT: exe-smoke.json
        run: |
          $p = Start-Process -FilePath dist/BatchWatermarkToolProV4_2.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'EXE smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw 'EXE smoke test failed' }
          $r = Get-Content exe-smoke.json | ConvertFrom-Json
          if (-not $r.success -or -not $r.dnd_available) { throw 'EXE verification failed' }
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification-reports
          path: '*-smoke.json'
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BatchWatermarkToolProV4_2-Windows
          path: dist/BatchWatermarkToolProV4_2.exe
          if-no-files-found: error
